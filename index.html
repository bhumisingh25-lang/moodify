<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moodify</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  
  <!-- FontAwesome Icons for Spotify & Headphones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --spotify-green: #1db954;
      --spotify-green-hover: #1ed760;
      --dark-bg: #121212;
      --nav-bg: rgba(0, 0, 0, 0.85);
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: var(--dark-bg);
      color: #ffffff;
      overflow-x: hidden;
    }

    /* Navbar Styling */
    .navbar {
      background-color: var(--nav-bg);
      backdrop-filter: blur(10px);
      padding: 1rem 2rem;
    }

    .navbar-brand {
      font-weight: 800;
      font-size: 1.5rem;
      color: #ffffff !important;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .navbar-brand i {
      color: var(--spotify-green);
      font-size: 1.8rem;
    }

    .nav-link {
      color: #b3b3b3 !important;
      font-weight: 600;
      font-size: 0.95rem;
      margin-left: 0.8rem;
      transition: color 0.3s ease;
    }

    .nav-link:hover, .nav-link.active {
      color: #ffffff !important;
    }

    .nav-link.wrapped {
      font-weight: 700;
      color: #ffffff !important;
    }

    /* Hero Section */
    .hero-section {
      position: relative;
      min-height: 90vh;
      background: linear-gradient(rgba(0, 0, 0, 0.75), rgba(18, 18, 18, 0.95)),
                  url('https://images.unsplash.com/photo-1598488035139-bdbb2231ce04?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    /* Headphones Animated Icon */
    .headphones-icon {
      font-size: 3.5rem;
      color: #e056fd;
      filter: drop-shadow(0 0 15px rgba(224, 86, 253, 0.6));
      margin-bottom: 0.5rem;
    }

    /* Welcome Text & Gradient */
    .hero-title {
      font-size: 4rem;
      font-weight: 800;
      background: linear-gradient(135deg, #f368e0, #e056fd, #1db954);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
      letter-spacing: -1px;
    }

    .hero-quote {
      font-style: italic;
      color: #d1d8e0;
      font-size: 1.25rem;
      margin-bottom: 2rem;
      opacity: 0.9;
    }

    /* Dynamic Feeling Badge */
    .mood-box {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(12px);
      padding: 0.8rem 2rem;
      border-radius: 50px;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.4rem;
      font-weight: 700;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    .mood-highlight {
      color: #00d2d3;
    }

    /* Spotify Green CTA Button */
    .btn-spotify {
      background-color: var(--spotify-green);
      color: #000000;
      font-weight: 700;
      padding: 0.8rem 2.2rem;
      border-radius: 50px;
      border: none;
      transition: all 0.3s ease;
      box-shadow: 0 0 20px rgba(29, 185, 84, 0.4);
    }

    .btn-spotify:hover {
      background-color: var(--spotify-green-hover);
      transform: scale(1.05);
      box-shadow: 0 0 30px rgba(29, 185, 84, 0.7);
      color: #000000;
    }
  </style>
</head>
<body>

  <!-- Navigation Bar -->
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container-fluid px-lg-5">
      <a class="navbar-brand" href="#">
        <i class="fa-brands fa-spotify"></i>
        <span>Moodify</span>
      </a>

      <button class="navbar-toggler navbar-dark" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="dashboard.html">Discover</a></li>
          <li class="nav-item"><a class="nav-link" href="artists.html">Artists</a></li>
          <li class="nav-item"><a class="nav-link" href="playlist.html">Playlists</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link active" href="contact.html">Contact</a></li>
          <li class="nav-item"><a class="nav-link active" href="wrapped.html">Moodify wrapped</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Hero Section -->
  <header class="hero-section">
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-8">
          
          <div>
            <i class="fa-solid fa-headphones headphones-icon"></i>
          </div>

          <h1 class="hero-title">Welcome</h1>

          <p class="hero-quote">"Music that understands your emotions."</p>

          <div class="mb-4">
            <div class="mood-box">
              <span>Feeling</span>
              <span id="moodText" class="mood-highlight">Happy</span>
              <span id="moodEmoji">😊</span>
            </div>
          </div>

          <div class="mt-4">
            <button class="btn btn-spotify btn-lg" id="listenBtn">
              Click to begin! <i class="fa-solid fa-arrow-right ms-2"></i>
            </button>
          </div>

        </div>
      </div>
    </div>
  </header>

  <!-- ES6 JavaScript -->
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      // Dynamic Mood Switcher
      const moods = [
        { text: 'Happy', emoji: '😊', color: '#00d2d3' },
        { text: 'Energetic', emoji: '⚡', color: '#ff9f43' },
        { text: 'Relaxed', emoji: '🎧', color: '#1db954' },
        { text: 'Focused', emoji: '🧠', color: '#54a0ff' }
      ];

      let currentIndex = 0;
      const moodTextEl = document.getElementById('moodText');
      const moodEmojiEl = document.getElementById('moodEmoji');

      const updateMood = () => {
        currentIndex = (currentIndex + 1) % moods.length;
        const currentMood = moods[currentIndex];
        
        moodTextEl.textContent = currentMood.text;
        moodTextEl.style.color = currentMood.color;
        moodEmojiEl.textContent = currentMood.emoji;
      };

      setInterval(updateMood, 3000);

      // Navigate directly to Discover (dashboard.html) on click
      const listenBtn = document.getElementById('listenBtn');
      listenBtn.addEventListener('click', () => {
        window.location.href = 'dashboard.html';
      });
    });
  </script>

  <!-- Bootstrap 5 JS Bundle -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/bootstrap.bundle.min.js"></script>
</body>
</html>
